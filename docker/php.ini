; Seguridad: no revelar tecnología ni versión en cabeceras HTTP
expose_php = Off

; Deshabilitar funciones peligrosas no usadas por la app
disable_functions = exec,passthru,shell_exec,system,proc_open,popen

; Limitar tamaño de subida (coherente con Nginx client_max_body_size 50M)
upload_max_filesize = 50M
post_max_size = 52M

; Opcache para rendimiento en producción
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
